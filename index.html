<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: radial-gradient(circle at top, #2b2b3d, #0f0f1a);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    color: #aaa;
    font-weight: normal;
  }
  .score-block {
    text-align: center;
    margin-top: 10px;
  }
  .score-label {
    font-size: 13px;
    color: #888;
  }
  .score {
    font-size: 44px;
    color: gold;
    font-weight: bold;
  }
  .coin-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .coin {
    width: 60vw;
    height: 60vw;
    max-width: 260px;
    max-height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFE066, #FFB300 60%, #B37700);
    box-shadow: 0 10px 40px rgba(255,180,0,0.4), inset 0 -10px 20px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18vw;
    cursor: pointer;
    transition: transform 0.05s;
    touch-action: manipulation;
  }
  @media (min-width: 500px) {
    .coin { font-size: 90px; }
  }
  .coin.tap {
    animation: pop 0.12s;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }
  .upgrade {
    width: 100%;
    max-width: 400px;
    background: #2c2c3e;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    margin-top: 10px;
    touch-action: manipulation;
  }
  .upgrade:active {
    background: #3a3a4e;
  }
  .upgrade-price {
    color: gold;
    font-weight: bold;
  }
  .float {
    position: fixed;
    color: gold;
    font-weight: bold;
    font-size: 22px;
    pointer-events: none;
    animation: floatUp 0.9s forwards;
    z-index: 999;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-80px); }
  }
</style>
</head>
<body>

  <h1>Моя игра</h1>

  <div class="score-block">
    <div class="score-label">Монет</div>
    <div class="score"><span id="score">0</span> 🪙</div>
  </div>

  <div class="coin-wrap">
    <div class="coin" id="coin">🪙</div>
  </div>

  <div class="upgrade" id="upgradeBtn">
    <span>Купить +1 к тапу</span>
    <span class="upgrade-price"><span id="price">10</span> 🪙</span>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let score = 0;
    let tapPower = 1;
    let upgradeCost = 10;

    function loadProgress() {
      const saved = localStorage.getItem('tapgame');
      if (saved) {
        const data = JSON.parse(saved);
        score = data.score || 0;
        tapPower = data.tapPower || 1;
        upgradeCost = data.upgradeCost || 10;
      }
    }

    function saveProgress() {
      localStorage.setItem('tapgame', JSON.stringify({
        score: score,
        tapPower: tapPower,
        upgradeCost: upgradeCost
      }));
    }

    setInterval(saveProgress, 3000);

    const coin = document.getElementById('coin');

    function tapCoin(e) {
      score = score + tapPower;
      document.getElementById('score').textContent = score;

      coin.classList.remove('tap');
      void coin.offsetWidth;
      coin.classList.add('tap');

      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;
      if (e.touches && e.touches[0]) {x = e.touches[0].clientX;
        y = e.touches[0].clientY;
      } else if (e.clientX) {
        x = e.clientX;
        y = e.clientY;
      }
      showFloat(x, y);

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function showFloat(x, y) {
      const el = document.createElement('div');
      el.className = 'float';
      el.textContent = '+' + tapPower;
      el.style.left = (x - 15) + 'px';
      el.style.top = (y - 30) + 'px';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 900);
    }

    coin.addEventListener('touchstart', function(e) {
      e.preventDefault();
      tapCoin(e);
    }, { passive: false });

    coin.addEventListener('click', function(e) {
      if (e.detail === 0) return;
      tapCoin(e);
    });

    function buyUpgrade() {
      if (score >= upgradeCost) {
        score = score - upgradeCost;
        tapPower = tapPower + 1;
        upgradeCost = upgradeCost * 2;
        document.getElementById('score').textContent = score;
        document.getElementById('price').textContent = upgradeCost;
        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
      } else {
        tg.showAlert('Не хватает монет!');
      }
    }

    document.getElementById('upgradeBtn').addEventListener('click', buyUpgrade);

    loadProgress();
    document.getElementById('score').textContent = score;
    document.getElementById('price').textContent = upgradeCost;
  </script>

</body>
</html>
